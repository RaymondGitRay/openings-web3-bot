# ─────────────────────────────────────────────────────────────
# Openings bot — what to fetch and where to post it
# Edit this file to add channels, companies or feeds.
# ─────────────────────────────────────────────────────────────

settings:
  max_posts_per_run: 100      # max jobs per digest
  # The bot checks for jobs every hour, but posts a digest only at these times (local time below).
  # If GitHub skips a run, the next hourly run catches up. Big batches split into several messages.
  digest_times: ["09:00", "14:00", "20:00"]
  digest_utc_offset: 8        # Singapore time (UTC+8)
  digest_post_early_at: 0     # 0 = never post between digest times
  google_every_hours: 3       # one Google Jobs search every 3 hours (~240/month, the SerpApi free plan)
  # Post style per channel: "digest" (default) = one compact message per run, jobs grouped by country
  #                         "cards"  = one detailed post per job, with the "Who should apply" line
  max_job_age_days: 10        # ignore jobs older than this (when a date is known)
  first_run_posts: 3          # on the very first run, post only this many, mark the rest as seen
  delay_between_posts: 3.2    # seconds between posts (Telegram allows ~20/min per channel)
  remember_days: 180          # a job (same company + title, or same link) is never re-posted within this window

channels:
  web3:
    chat_id: "@Openings_Web3"
    hashtag: "#Web3Jobs"
    title: "Web3 jobs"
    format: digest
    footer: "🔗 Openings network · Hiring or collaborating? Tap 💬 below to message us"

    # Welcome message posted with "--pin" (run mode "pin"), with a DM button that opens the bot inbox
    pinned:
      file: pinned_message.html
      button: "💬 DM us to hire or collaborate"
      url: "https://t.me/Openings_Web3_bot?start=pinned"

