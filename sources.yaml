    # Slugs that are generic words: only keep their jobs if they mention Web3 keywords
    keyword_check_companies: [crypto, base, safe, bridge, ton, scroll, figure, merkle, compound,
      curve, agora, framework, near, jupiter, galaxy, copper, taurus, talos, dune, balancer, kava,
      monad, parity, avalanche, polygon, optimism, solana, celestia, linea, mantle, cronos, morpho,
      pendle, zora, blur, argent, privy, turnkey, sardine, figment, kiln, anza, auros, lido, osl,
      cobo, luno, pintu, valr, ripio, triplea, transak, banxa, wirex, kaiko, dune, gnosis]

    # Web3 job boards (free API keys, stored as GitHub secrets)
    web3career: true          # needs secret WEB3CAREER_TOKEN
    cryptojobslist: true      # needs secret CJL_API_KEY

    # General sources — only jobs matching "keywords" are kept
    # Google Jobs via SerpApi (secret SERPAPI_KEY). One search per run, rotating across ALL channels' queries.
    google_queries: ["web3 jobs", "blockchain developer", "crypto business development", "crypto compliance",
      "web3 marketing", "defi engineer", "crypto jobs singapore", "stablecoin jobs", "digital assets jobs",
      "crypto exchange jobs", "smart contract engineer"]
    remoteok: true

    # Auto-discovery: any job link pointing at a company job board is added as a permanent
    # source. With secret BRAVE_API_KEY, the bot also searches the web for new boards.
    discover: true
    brave_queries: ["site:jobs.ashbyhq.com crypto", "site:jobs.ashbyhq.com web3", "site:jobs.lever.co crypto",
      "site:jobs.lever.co web3", "site:job-boards.greenhouse.io crypto", "site:boards.greenhouse.io web3",
      "site:apply.workable.com crypto", "site:jobs.ashbyhq.com defi", "site:jobs.lever.co blockchain",
      "site:job-boards.greenhouse.io stablecoin", "site:teamtailor.com web3", "site:breezy.hr crypto"]
    keywords: [web3, crypto, blockchain, defi, stablecoin, ethereum, solana, bitcoin, nft, onchain, "on-chain", tokenization, wallet, custody, dao, "smart contract", solidity, "digital assets"]

    # Extra RSS feeds (optional). Any job RSS feed works.
    rss: []

