name: Post jobs

on:
  schedule:
    - cron: "23 * * * *"     # every hour (UTC) at minute 23; digests still go out ~every 3h (see sources.yaml)
  workflow_dispatch:          # lets you click "Run workflow" manually
    inputs:
      mode:
        description: "normal, now, preview, dry-run, check, or pin"
        default: "normal"

permissions:
  contents: write             # needed to save seen_jobs.json back to the repo

concurrency:
  group: post-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          WEB3CAREER_TOKEN: ${{ secrets.WEB3CAREER_TOKEN }}
          CJL_API_KEY: ${{ secrets.CJL_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          if [ "$MODE" = "dry-run" ]; then python main.py --dry-run
          elif [ "$MODE" = "check" ]; then python main.py --check
          elif [ "$MODE" = "pin" ]; then python main.py --pin
          elif [ "$MODE" = "preview" ]; then python main.py --preview
          elif [ "$MODE" = "now" ]; then python main.py --now
          else python main.py; fi

      - name: Save state
        run: |
          git config user.name "openings-bot"
          git config user.email "openings-bot@users.noreply.github.com"
          git add seen_jobs.json || true
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git push || echo "nothing to push"
