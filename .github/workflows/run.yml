name: Post jobs

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), at minute 17
  workflow_dispatch:          # lets you click "Run workflow" manually
    inputs:
      mode:
        description: "normal, dry-run, or check"
        default: "normal"

permissions:
  contents: write             # needed to save seen_jobs.json back to the repo

concurrency:
  group: post-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          if [ "$MODE" = "dry-run" ]; then python main.py --dry-run
          elif [ "$MODE" = "check" ]; then python main.py --check
          else python main.py; fi

      - name: Save state
        run: |
          git config user.name "openings-bot"
          git config user.email "openings-bot@users.noreply.github.com"
          git add seen_jobs.json || true
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git push || echo "nothing to push"
